<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="OpenFlow — local voice OS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0b12" />
      <stop offset="55%" stop-color="#0d0f1a" />
      <stop offset="100%" stop-color="#120e1c" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)" />
  <rect width="1200" height="300" rx="20" fill="url(#glow)" />
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200" />
    <path d="M60 0v300M180 0v300M300 0v300M420 0v300M540 0v300M660 0v300M780 0v300M900 0v300M1020 0v300M1140 0v300" />
  </g>

  <g transform="translate(72 96)">
    <rect x="0" y="0" width="108" height="108" rx="26" fill="#0b0d14" stroke="url(#brand)" stroke-width="2" />
    <g fill="url(#bar)">
      <rect x="20" y="44" width="8" height="20" rx="4" />
      <rect x="34" y="32" width="8" height="44" rx="4" />
      <rect x="48" y="22" width="8" height="64" rx="4" />
      <rect x="62" y="34" width="8" height="40" rx="4" />
      <rect x="76" y="46" width="8" height="16" rx="4" />
    </g>
  </g>

  <text x="208" y="140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1.5">OpenFlow</text>
  <text x="210" y="180" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#a1a1b5">The open-source, 100% offline voice OS</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect x="208" y="204" width="196" height="32" rx="16" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.35" />
    <text x="226" y="225" fill="#a5b4fc">⌘ dictation</text>
    <rect x="416" y="204" width="214" height="32" rx="16" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.35" />
    <text x="434" y="225" fill="#d8b4fe">◍ voice cloning</text>
    <rect x="642" y="204" width="196" height="32" rx="16" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3" />
