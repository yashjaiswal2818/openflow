[package]
name = "openflow"
version = "1.0.0"
description = "OpenFlow — The open-source, local-first Voice OS for smart dictation & voice cloning."
authors = ["OpenFlow Contributors"]
edition = "2021"

[lib]
name = "openflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
